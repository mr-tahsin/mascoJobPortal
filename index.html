<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MASCO Job Portal | Careers at MASCO Group Bangladesh</title>

    <meta
      name="description"
      content="Join MASCO Group, one of Bangladesh's leading garments, knitting and textile manufacturers. Explore career opportunities, apply online and build your future with MASCO."
    />

    <meta
      name="keywords"
      content="MASCO Group, MASCO Careers, Garments Jobs Bangladesh, Textile Jobs Bangladesh, Knitting Jobs Bangladesh, Recruitment Portal"
    />

    <meta name="robots" content="index,follow" />
    <meta name="author" content="MASCO Group" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MASCO Group" />
    <meta
      property="og:title"
      content="Careers at MASCO Group | Leading Garments & Textile Manufacturer in Bangladesh"
    />
    <meta
      property="og:description"
      content="Discover career opportunities at MASCO Group. Join one of Bangladesh's leading garments, knitting and textile manufacturing organizations."
    />

    <!-- Replace with your actual website URL -->
    <meta property="og:url" content="https://mis.mascoknit.com/" />

    <!-- Replace with a 1200x630 banner image -->
    <meta property="og:image" content="assets/img/masco_logo.png" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Careers at MASCO Group Bangladesh" />
    <meta
      name="twitter:description"
      content="Explore jobs and career opportunities at MASCO Group."
    />
    <meta name="twitter:image" content="assets/img/masco_logo.png" />

    <link rel="canonical" href="https://mis.mascoknit.com/" />

    <link rel="icon" href="assets/img/masco_logo.png" />
    <link rel="stylesheet" href="assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <h2>MASCO Job Portal</h2>
          <p>Login to your account</p>
        </div>

        <form>
          <div class="form-group">
            <label>Email</label>
            <input
              type="email"
              class="form-control"
              placeholder="Enter Email"
            />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Enter Password"
            />
          </div>

          <div class="form-options">
            <label>
              <input type="checkbox" />
              Remember Me
            </label>

            <a href="pages/12-forgot-password.html">Forgot Password?</a>
          </div>

          <button
            type="button"
            class="btn-primary"
            onclick="window.location.href = 'pages/dashboard.html'"
          >
            Login
          </button>

          <div class="auth-footer">
            Don't have an account?
            <a href="pages/register.html">Register</a> <br />
            <a href="pages/9-website-career-page.html">Click to view Website</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
